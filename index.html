<!DOCTYPE html>
<html>
<head>

<title>Crop Yield Prediction</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<div class="container">

<h1>🌾 Crop Yield Prediction System</h1>
<p>Predict crop yield using Machine Learning</p>

<form action="/predict" method="post">

<table>

<tr>
<td>Year</td>
<td><input type="number" name="year" required></td>
</tr>

<tr>
<td>Rainfall (mm)</td>
<td><input type="number" step="any" name="rainfall" required></td>
</tr>

<tr>
<td>Pesticides (tonnes)</td>
<td><input type="number" step="any" name="pesticides" required></td>
</tr>

<tr>
<td>Temperature</td>
<td><input type="number" step="any" name="temp" required></td>
</tr>

<tr>
<td>Area</td>
<td><input type="text" name="area" placeholder="India / Brazil / US" required></td>
</tr>

<tr>
<td>Crop</td>
<td><input type="text" name="item" placeholder="Wheat / Rice / Maize" required></td>
</tr>

<tr>
<td colspan="2" style="text-align:center;">
<button type="submit">Predict Yield</button>
</td>
</tr>

</table>

</form>

<h2>{{ prediction_text }}</h2>

</div>

</body>
</html>
